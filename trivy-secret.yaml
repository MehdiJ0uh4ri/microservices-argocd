rules:
  - id: private-key
    category: general
    title: Private Key
    severity: CRITICAL
    regex: "-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----"

  - id: aws-access-key
    category: general
    title: AWS Access Key ID
    severity: CRITICAL
    regex: "AKIA[0-9A-Z]{16}"

  - id: github-token
    category: general
    title: GitHub Personal Access Token
    severity: CRITICAL
    regex: "ghp_[0-9a-zA-Z]{36}"

  - id: slack-token
    category: general
    title: Slack Token
    severity: HIGH
    regex: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[0-9a-zA-Z]{24,32}"
