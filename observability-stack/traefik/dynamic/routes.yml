# TLS certificate store for all obs.local domains.
# IMPORTANT: Traefik v3 runs as a non-root user inside the container.
# key.pem MUST be chmod 644 (not 600) or Traefik silently falls back to its
# internal self-signed cert and all routers return 404.
#
# Generate / regenerate certs:
#   sudo openssl req -x509 -newkey rsa:2048 \
#     -keyout /opt/observability/certs/key.pem \
#     -out  /opt/observability/certs/cert.pem \
#     -days 365 -nodes -subj "/CN=obs.local" \
#     -addext "subjectAltName=DNS:grafana.obs.local,DNS:prometheus.obs.local,DNS:loki.obs.local,DNS:jaeger.obs.local,DNS:boutique.obs.local"
#   sudo chmod 644 /opt/observability/certs/key.pem
#   docker restart traefik
tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem

http:
  routers:
    boutique:
      rule: "Host(`boutique.obs.local`)"
      entryPoints: [websecure]
      tls: {}
      service: boutique-backend

    prometheus:
      rule: "Host(`prometheus.obs.local`)"
      entryPoints: [websecure]
      tls: {}
      service: prometheus-backend

    grafana:
      rule: "Host(`grafana.obs.local`)"
      entryPoints: [websecure]
      tls: {}
      service: grafana-backend

    loki:
      rule: "Host(`loki.obs.local`)"
      entryPoints: [websecure]
      tls: {}
      service: loki-backend

    jaeger:
      rule: "Host(`jaeger.obs.local`)"
      entryPoints: [websecure]
      tls: {}
      service: jaeger-backend

  services:
    boutique-backend:
      loadBalancer:
        servers:
          - url: "http://boutique-k3s.local:30080"

    prometheus-backend:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"

    grafana-backend:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    loki-backend:
      loadBalancer:
        servers:
          - url: "http://loki:3100"

    jaeger-backend:
      loadBalancer:
        servers:
          - url: "http://jaeger:16686"