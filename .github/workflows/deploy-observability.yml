name: Deploy Observability Stack

on:
  push:
    branches: [main]
    paths:
      - "observability-stack/**"
      - ".github/workflows/deploy-observability.yml"

permissions:
  contents: read
  security-events: write

jobs:
  # ── DevSecOps gate ──────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on repo (IaC + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./observability-stack
          severity: HIGH,CRITICAL
          output: trivy-obs.sarif
          format: sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-obs.sarif

  # ── Deploy ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server A
    runs-on: ubuntu-24.04
    needs: security-scan
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to Server A
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OBS_SSH_HOST }}
          username: ${{ secrets.OBS_SSH_USER }}
          key: ${{ secrets.OBS_SSH_KEY }}
          source: "observability-stack/"
          target: "/opt/observability"
          strip_components: 1



      - name: Generate Self-Signed Certificates
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.OBS_SSH_HOST }}
          username: ${{ secrets.OBS_SSH_USER }}
          key: ${{ secrets.OBS_SSH_KEY }}
          script: |
            # Create the certs directory
            sudo mkdir -p /opt/observability/certs
            
            # Generate the self-signed cert if it doesn't already exist
            if [ ! -f /opt/observability/certs/cert.pem ]; then
              sudo openssl req -x509 -newkey rsa:4096 \
                -keyout /opt/observability/certs/key.pem \
                -out /opt/observability/certs/cert.pem \
                -days 365 -nodes \
                -subj "/CN=*.obs.local"
            fi

            
      - name: Deploy stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OBS_SSH_HOST }}
          username: ${{ secrets.OBS_SSH_USER }}
          key: ${{ secrets.OBS_SSH_KEY }}
          script: |
            cd /opt/observability
            docker compose down || true
            docker compose up -d
            docker compose ps

      - name: Notify Slack — success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: '{"text":"✅ Observability stack deployed successfully on ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify Slack — failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: '{"text":"❌ Observability stack deployment FAILED — ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
