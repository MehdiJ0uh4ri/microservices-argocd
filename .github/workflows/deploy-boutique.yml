name: Deploy Online Boutique (k3s + ArgoCD)

permissions:
  contents: read
  security-events: write


on:
  push:
    branches: [main]
    paths:
      - "boutique/**"
      - ".github/workflows/deploy-boutique.yml"

jobs:
  # ── DevSecOps gate ──────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan — Kubernetes manifests
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./boutique
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-boutique.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-boutique.sarif

  # ── Bootstrap k3s + ArgoCD (idempotent) ────────────────────────
  bootstrap:
    name: Bootstrap Server B
    runs-on: ubuntu-24.04
    needs: security-scan
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy all boutique files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.APP_SSH_HOST }}
          username: ${{ secrets.APP_SSH_USER }}
          key: ${{ secrets.APP_SSH_KEY }}
          source: "boutique/argocd/install-argocd.sh,boutique/argocd/boutique-app.yml,boutique/manifests/boutique-namespace.yml,boutique/manifests/frontend-nodeport.yml"
          target: "/tmp/boutique"
          strip_components: 1

      - name: Install k3s + ArgoCD (idempotent)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_SSH_HOST }}
          username: ${{ secrets.APP_SSH_USER }}
          key: ${{ secrets.APP_SSH_KEY }}
          script: |
            # Install k3s if not already installed
            if ! command -v k3s &> /dev/null; then
              curl -sfL https://get.k3s.io | sh -
            fi
            # Make kubeconfig accessible without sudo
            if [ ! -f ~/.kube/config ]; then
              mkdir -p ~/.kube
              sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
              sudo chown $(id -u):$(id -g) ~/.kube/config
            fi
            # Install ArgoCD (idempotent)
            bash /tmp/boutique/argocd/install-argocd.sh

      - name: Apply ArgoCD app + NodePort service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_SSH_HOST }}
          username: ${{ secrets.APP_SSH_USER }}
          key: ${{ secrets.APP_SSH_KEY }}
          script: |
            export KUBECONFIG=~/.kube/config
            # Apply namespace and ArgoCD Application
            kubectl apply -f /tmp/boutique/manifests/boutique-namespace.yml
            kubectl apply -f /tmp/boutique/argocd/boutique-app.yml
            # Wait for ArgoCD to sync the app (up to 5 min)
            kubectl wait --for=condition=Synced=true application/boutique \
              -n argocd --timeout=300s || true
            # Expose frontend via NodePort :30080
            kubectl apply -f /tmp/boutique/manifests/frontend-nodeport.yml
            # Show status
            kubectl get pods -n boutique
            kubectl get svc -n boutique

      - name: Notify Slack — success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: '{"text":"✅ Online Boutique deployed successfully via ArgoCD on ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify Slack — failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: '{"text":"❌ Online Boutique deployment FAILED — ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
